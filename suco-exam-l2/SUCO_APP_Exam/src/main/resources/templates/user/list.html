<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::section})}">
<title>Quản lý User</title>
<section>
    <div class="d-flex justify-content-between mb-3">
        <h3><i class="bi bi-people"></i> Quản lý User</h3>
        <a th:href="@{/users/create}" class="btn btn-primary"><i class="bi bi-person-plus"></i> Thêm user</a>
    </div>
    <div class="card shadow-sm">
        <table class="table table-hover mb-0">
            <thead class="table-light">
            <tr><th>ID</th><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th>Ngày tạo</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.maND}"></td>
                <td th:text="${u.hoTen}"></td>
                <td th:text="${u.email}"></td>
                <td><span class="badge" th:classappend="${u.admin} ? 'bg-danger' : 'bg-primary'" th:text="${u.vaiTro}"></span></td>
                <td>
                    <span th:if="${u.active}" class="badge bg-success">Active</span>
                    <span th:unless="${u.active}" class="badge bg-secondary">Khóa</span>
                </td>
                <td th:text="${u.ngayTao != null ? #temporals.format(u.ngayTao, 'dd/MM/yyyy') : ''}"></td>
                <td class="text-nowrap">
                    <a th:href="@{/users/{id}/edit(id=${u.maND})}" class="btn btn-sm btn-outline-primary">Sửa</a>
                    <form th:action="@{/users/{id}/toggle(id=${u.maND})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-warning"
                                th:text="${u.active} ? 'Khóa' : 'Mở khóa'"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</html>
