<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:replace="${title}">Smart Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        body { background: #f4f6f9; }
        .sidebar { min-height: 100vh; background: #1e293b; }
        .sidebar a { color: #cbd5e1; text-decoration: none; display: block; padding: .55rem 1rem; border-radius: .4rem; margin-bottom: 2px; font-size: .95rem; }
        .sidebar a:hover { background: #334155; color: #fff; }
        .overdue { background-color: #fee2e2 !important; }
        .badge-MOI { background: #3b82f6; }
        .badge-DANG_XU_LY { background: #f59e0b; }
        .badge-DA_XU_LY { background: #10b981; }
        .badge-DONG { background: #6b7280; }
        .timeline-item { border-left: 3px solid #3b82f6; padding-left: 1rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 sidebar py-3 px-2">
            <h5 class="text-white px-2 mb-3"><i class="bi bi-building"></i> Smart Campus</h5>
            <div class="text-secondary small px-2 mb-3" th:if="${currentUser != null}"
                 th:text="${currentUser.hoTen + ' (' + currentUser.vaiTro + ')'}"></div>
            <a th:href="@{/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a th:href="@{/projects}"><i class="bi bi-folder"></i> Dự án</a>
            <a th:href="@{/tasks}"><i class="bi bi-list-task"></i> Công việc</a>
            <a th:href="@{/incidents}"><i class="bi bi-exclamation-triangle"></i> Sự cố</a>
            <a th:href="@{/incidents/create}"><i class="bi bi-plus-circle"></i> Tạo sự cố</a>
            <a th:if="${currentUser != null and currentUser.admin}" th:href="@{/users}">
                <i class="bi bi-people"></i> Quản lý User
            </a>
            <a th:href="@{/export/excel}"><i class="bi bi-file-earmark-excel"></i> Xuất Excel</a>
            <hr class="border-secondary"/>
            <a th:href="@{/logout}" class="text-danger"><i class="bi bi-box-arrow-right"></i> Đăng xuất</a>
        </nav>
        <main class="col-md-10 py-4 px-4">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:replace="${content}">Content</div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
