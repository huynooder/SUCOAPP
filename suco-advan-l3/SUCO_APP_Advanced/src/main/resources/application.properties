# ==================== SUCO_APP Exam – Smart Campus ====================
spring.application.name=smart-campus
server.port=8080

# ----- Oracle: bỏ comment đúng dòng theo máy -----
# XE 18c/21c:
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
# Oracle Free / 23ai / 26ai Free:
# spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
# SID XE cũ:
# spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE

spring.datasource.username=smartcampus
spring.datasource.password=smartcampus
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

spring.thymeleaf.cache=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.session.timeout=30m

app.ai.enabled=false
app.ai.api-url=
app.ai.api-key=
app.ai.model=gpt-4o-mini
