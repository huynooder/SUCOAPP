<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::section})}">
<head><title>Danh mục – Smart Campus</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="mb-1"><i class="bi bi-tags text-primary"></i> Danh mục sự cố</h3>
            <p class="text-muted mb-0 small">12 nhóm phân loại liên quan Smart Campus</p>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card card-modern">
                <div class="card-header">Danh sách danh mục</div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0 align-middle">
                            <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>Tên</th>
                                <th>Mô tả</th>
                                <th>Màu</th>
                                <th>TT</th>
                                <th></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="c : ${items}">
                                <td th:text="${c.maDM}"></td>
                                <td>
                                    <span class="badge rounded-pill text-white"
                                          th:style="'background:' + ${c.mauSac}"
                                          th:text="${c.tenDM}"></span>
                                </td>
                                <td class="small text-muted" th:text="${c.moTa}"></td>
                                <td><span class="rounded-circle d-inline-block"
                                          th:style="'width:18px;height:18px;background:' + ${c.mauSac}"></span></td>
                                <td>
                                    <span th:if="${c.trangThai == 1}" class="badge bg-success">Active</span>
                                    <span th:unless="${c.trangThai == 1}" class="badge bg-secondary">Tắt</span>
                                </td>
                                <td>
                                    <form th:action="@{/categories/toggle/{id}(id=${c.maDM})}" method="post" class="d-inline">
                                        <button class="btn btn-sm btn-outline-secondary rounded-pill" type="submit">Đổi TT</button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card card-modern">
                <div class="card-header">Thêm / sửa danh mục</div>
                <div class="card-body">
                    <form th:action="@{/categories/save}" method="post">
                        <input type="hidden" name="maDM" id="editId"/>
                        <div class="mb-3">
                            <label class="form-label">Tên danh mục</label>
                            <input class="form-control" name="tenDM" required placeholder="VD: Camera an ninh"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mô tả</label>
                            <textarea class="form-control" name="moTa" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Màu badge</label>
                            <input type="color" class="form-control form-control-color" name="mauSac" value="#3b82f6"/>
                        </div>
                        <button class="btn btn-primary rounded-pill w-100" type="submit">
                            <i class="bi bi-save"></i> Lưu
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
