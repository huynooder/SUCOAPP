<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:replace="${title}">Smart Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --sc-bg: #0f172a;
            --sc-side: #1e293b;
            --sc-accent: #38bdf8;
            --sc-card: #ffffff;
            --sc-muted: #94a3b8;
        }
        body { background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%); min-height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif; }
        .sidebar {
            min-height: 100vh; background: var(--sc-side);
            box-shadow: 4px 0 24px rgba(0,0,0,.12);
            position: sticky; top: 0;
        }
        .sidebar .brand {
            font-weight: 700; font-size: 1.15rem; color: #fff;
            padding: 1.2rem 1rem .8rem; letter-spacing: .02em;
        }
        .sidebar .brand i { color: var(--sc-accent); }
        .sidebar .user-pill {
            margin: 0 0.75rem 1rem; padding: .4rem .75rem;
            background: rgba(56,189,248,.12); border-radius: 2rem;
            color: var(--sc-accent); font-size: .8rem;
        }
        .sidebar a {
            color: #cbd5e1; text-decoration: none; display: flex; align-items: center; gap: .6rem;
            padding: .6rem 1rem; margin: 2px 8px; border-radius: .5rem; font-size: .92rem;
            transition: all .15s ease;
        }
        .sidebar a:hover, .sidebar a.active {
            background: rgba(56,189,248,.15); color: #fff;
        }
        .sidebar a i { width: 1.25rem; text-align: center; }
        .sidebar .nav-section {
            color: var(--sc-muted); font-size: .7rem; text-transform: uppercase;
            letter-spacing: .08em; padding: .8rem 1.2rem .3rem;
        }
        .sidebar hr { border-color: #334155; margin: .75rem 1rem; }
        main { padding: 1.5rem 1.75rem; }
        .card-modern {
            border: none; border-radius: 1rem; box-shadow: 0 4px 20px rgba(15,23,42,.06);
            background: var(--sc-card); overflow: hidden;
        }
        .card-modern .card-header {
            background: transparent; border-bottom: 1px solid #f1f5f9;
            font-weight: 600; padding: 1rem 1.25rem;
        }
        .stat-card {
            border-radius: 1rem; padding: 1.25rem; color: #fff;
            box-shadow: 0 8px 24px rgba(0,0,0,.12);
        }
        .stat-card .label { opacity: .85; font-size: .85rem; }
        .stat-card .value { font-size: 1.75rem; font-weight: 700; }
        .badge-MOI { background: #3b82f6; }
        .badge-DANG_XU_LY { background: #f59e0b; }
        .badge-DA_XU_LY { background: #10b981; }
        .badge-DONG { background: #6b7280; }
        .overdue { background-color: #fef2f2 !important; }
        .tree-root { list-style: none; padding-left: 0; }
        .tree-root ul { list-style: none; padding-left: 1.5rem; border-left: 2px solid #e2e8f0; margin-left: .5rem; }
        .tree-node {
            padding: .45rem .75rem; margin: .25rem 0; border-radius: .5rem;
            background: #f8fafc; display: inline-flex; align-items: center; gap: .4rem;
            font-size: .9rem;
        }
        .tree-node.project { background: #e0f2fe; color: #0369a1; font-weight: 600; }
        .tree-node.category { background: #f0fdf4; color: #166534; }
        .tree-node.incident { background: #fff; border: 1px solid #e2e8f0; }
        .ai-result {
            white-space: pre-wrap; background: #0f172a; color: #e2e8f0;
            border-radius: .75rem; padding: 1.25rem; font-family: ui-monospace, monospace; font-size: .88rem;
        }
        @media (max-width: 768px) {
            .sidebar { min-height: auto; position: relative; }
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 sidebar py-2 px-0">
            <div class="brand"><i class="bi bi-buildings"></i> Smart Campus</div>
            <div class="user-pill" th:if="${currentUser != null}"
                 th:text="${currentUser.hoTen + ' · ' + currentUser.vaiTro}"></div>

            <div class="nav-section">Chính</div>
            <a th:href="@{/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a th:href="@{/projects}"><i class="bi bi-folder2-open"></i> Dự án</a>
            <a th:href="@{/tasks}"><i class="bi bi-list-check"></i> Công việc</a>
            <a th:href="@{/incidents}"><i class="bi bi-exclamation-triangle"></i> Sự cố</a>
            <a th:href="@{/incidents/create}"><i class="bi bi-plus-circle"></i> Tạo sự cố</a>

            <div class="nav-section">Phân loại &amp; Phân tích</div>
            <a th:href="@{/categories}"><i class="bi bi-tags"></i> Danh mục</a>
            <a th:href="@{/tree}"><i class="bi bi-diagram-3"></i> Cây quan hệ</a>
            <a th:href="@{/ai}"><i class="bi bi-robot"></i> Trợ lý AI</a>

            <div class="nav-section">Hệ thống</div>
            <a th:if="${currentUser != null and currentUser.admin}" th:href="@{/users}">
                <i class="bi bi-people"></i> Quản lý User
            </a>
            <a th:href="@{/export/excel}"><i class="bi bi-file-earmark-excel"></i> Xuất Excel</a>
            <hr/>
            <a th:href="@{/logout}" class="text-danger"><i class="bi bi-box-arrow-right"></i> Đăng xuất</a>
        </nav>
        <main class="col-md-10">
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show rounded-3 border-0 shadow-sm">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3 border-0 shadow-sm">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:replace="${content}">Content</div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
